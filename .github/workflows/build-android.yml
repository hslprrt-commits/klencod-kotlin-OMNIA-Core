
name: Build Android Kotlin APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klencod-kotlin-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          RESULT=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$RESULT" -ne 0 ]; then
            echo "ERROR: SDK license acceptance failed"
            exit "$RESULT"
          fi

          echo "SDK licenses accepted."

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME/platforms/android-34" || {
            echo "ERROR: Android 34 platform not found"
            exit 1
          }

          test -d "$ANDROID_HOME/build-tools/34.0.0" || {
            echo "ERROR: Build Tools 34.0.0 not found"
            exit 1
          }

          echo "Android SDK verification passed."

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          test -d app || {
            echo "ERROR: app directory not found"
            exit 1
          }

          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "Using Gradle Wrapper"
            ./gradlew --version
          elif command -v gradle >/dev/null 2>&1; then
            echo "Using installed Gradle"
            gradle --version
          else
            echo "ERROR: No Gradle Wrapper or installed Gradle found"
            exit 1
          fi

      - name: Validate Android manifests
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          manifests = list(pathlib.Path("app/src").rglob("AndroidManifest.xml"))

          if not manifests:
              raise SystemExit("ERROR: AndroidManifest.xml not found")

          for manifest in manifests:
              print("Checking:", manifest)
              ET.parse(manifest)

          print("Manifest XML syntax OK")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/klencod-gradle.log"

          if [ -f gradlew ]; then
            ./gradlew --no-daemon --build-cache \
              :app:assembleDebug -x lint -x test \
              --stacktrace --info 2>&1 | tee "$LOG"
          else
            gradle --no-daemon --build-cache \
              :app:assembleDebug -x lint -x test \
              --stacktrace --info 2>&1 | tee "$LOG"
          fi

      - name: Print detailed diagnostics
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/klencod-gradle.log"

          echo "===== Detailed Gradle diagnostics ====="

          if [ -f "$LOG" ]; then
            tail -n 250 "$LOG"
          else
            echo "Gradle log not found."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: klencod-kotlin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
