
name: Build Android Kotlin APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klencod-kotlin-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          echo "Android SDK verification passed."

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/klencod-gradle.log"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --build-cache \
              :app:assembleDebug -x lint -x test \
              --stacktrace --info 2>&1 | tee "$LOG"
          else
            gradle --no-daemon --build-cache \
              :app:assembleDebug -x lint -x test \
              --stacktrace --info 2>&1 | tee "$LOG"
          fi

      - name: Print detailed diagnostics
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/klencod-gradle.log"
          echo "===== Detailed Gradle diagnostics ====="
          if [ -f "$LOG" ]; then
            tail -n 250 "$LOG"
          else
            echo "Gradle log not found."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: klencod-kotlin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
          
          
          
          
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
